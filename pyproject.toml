[project]
name = "smart-rag-ai"
version = "0.1.0"
description = "Local-first SME knowledge assistant with trustworthy citations"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "diff-cover>=9.2",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src", "apps"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:",]

[tool.ruff.lint.per-file-ignores]
# Fixture objects as default arguments are idiomatic pytest parametrisation.
"tests/**" = ["B008"]

[tool.mypy]
files = ["src", "apps"]
python_version = "3.12"
