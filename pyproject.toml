[project]
name = "smart-rag-ai"
version = "0.1.0"
description = "Local-first SME knowledge assistant with trustworthy citations"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
