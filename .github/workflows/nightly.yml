name: nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  # Full release gate plus host diagnostics. Docker is available on the Linux
  # runner; macOS/Windows runners have no Docker/Ollama, so `make doctor`
  # stays a host gate there and those platforms run the install smoke job.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Ollama with profile models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          ollama pull qwen3:8b
          ollama pull bge-m3
      - run: uv sync
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make doctor
      - run: make check-release

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - run: npm install
      - run: uv run python -m compileall -q src apps
      - run: uv run pytest tests/unit -q
      - run: npm run build -w apps/web
